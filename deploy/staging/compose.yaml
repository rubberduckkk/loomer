name: looomer-staging
x-app: &app
  image: looomer-staging:${RELEASE:?set RELEASE}
  restart: unless-stopped
  environment: &database
    LOOOMER_DATABASE_URL: postgresql://looomer:${POSTGRES_PASSWORD:?set password}@db/looomer
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: looomer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "looomer"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    <<: *app
    environment:
      <<: *database
      LOOOMER_API_TOKEN: ${LOOOMER_API_TOKEN:?set token}
    command: ["serve", "--host", "0.0.0.0"]
    ports: ["127.0.0.1:8080:8080"]
  ingest:
    <<: *app
    command: ["worker", "ingest"]
  analysis:
    <<: *app
    environment:
      <<: *database
      LOOOMER_PROVIDER: openai
      LOOOMER_MAX_OUTPUT_TOKENS: ${LOOOMER_MAX_OUTPUT_TOKENS:-4096}
      LOOOMER_MODEL: ${LOOOMER_MODEL:?set model}
      # The Strands adapter speaks the router's Chat Completions protocol.
      OPENAI_BASE_URL: ${LOOOMER_ROUTER_URL:-https://openrouter.ai/api/v1}
      OPENAI_API_KEY: ${LOOOMER_ROUTER_API_KEY:?set router API key}
    command: ["worker", "analysis"]
volumes:
  pgdata:
