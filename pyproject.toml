[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "looomer"
version = "0.3.0"
description = "A data-to-artifact workbench powered by Strands"
requires-python = ">=3.11"
dependencies = ["strands-agents[openai]>=1.65,<2", "jsonschema>=4.23,<5", "Pillow>=11,<13"]

[project.urls]
Homepage = "https://looomer.com"

[project.optional-dependencies]
anthropic = ["strands-agents[anthropic]>=1.65,<2"]
google = ["strands-agents[gemini]>=1.65,<2"]
ollama = ["strands-agents[ollama]>=1.65,<2"]
dev = ["pytest>=8,<10"]
service = ["psycopg[binary]>=3.2,<4", "starlette>=0.40,<2", "uvicorn>=0.30,<1", "httpx>=0.28,<1"]

[project.scripts]
looomer = "looomer.apps.photo_curation.cli:main"
looomer-core = "looomer.core.service:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"looomer.core" = ["*.json"]
"looomer.apps.photo_curation" = ["*.json"]
"looomer.apps.activity_recap" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
