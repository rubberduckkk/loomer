name: Staging
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -c requirements-lock.txt '.[service,dev]'
      - run: python -m pytest -q
        env:
          LOOOMER_TEST_DATABASE_URL: postgresql://postgres:test@localhost/postgres
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    concurrency: looomer-staging
    steps:
      - name: Deploy tested commit
        env:
          HOST: ${{ vars.STAGING_HOST }}
          KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          set -eu
          install -m 700 -d ~/.ssh
          umask 077
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "deploy@$HOST" "$GITHUB_SHA"
